    }

    .proc-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

      box-sizing: border-box;
      transition: background-color 0.2s, border-color 0.2s;

    .card.deduct {

    }

    .card.highlighted-point {

      background: var(--accent-red);

      font-size: 10px;
      font-weight: 700;

      border-radius: 4px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;

      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .card-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      min-width: 75px;
      text-align: right;
      border-left: 1px solid var(--border-color);
      padding-left: 12px;
    }

    .point-desc {
      font-size: 15px;
      font-weight: 600;

      color: var(--text-main);

      padding: 8px;
      background: #fff;
      color: var(--text-main);
      font-family: inherit;
      box-sizing: border-box;

      font-size: 13px;

      padding: 8px 12px;
      border-radius: 6px;
      flex: 1;

    .upload-btn-group {

      flex-direction: column;
      gap: 6px;
      margin-top: 5px;

    .file-inputs-ui {

      flex-wrap: wrap;
      gap: 10px;

    .custom-upload-btn {

      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid var(--border-color);

    .btn-type-gallery { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
    .btn-type-camera { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }

    button {
      background: #fff;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    button.btn-share { background: #25d366; color: #fff; border: none; }
    button.btn-share-summary { background: #128c7e; color: #fff; border: none; }
    button.btn-share-text { background: #0d9488; color: #fff; border: none; }
    button.btn-excel { background: #1f7244; color: #fff; border: none; }
    button.btn-pdf { background: #e53e3e; color: #fff; border: none; }

    .comment-box {
      margin-top: 8px;
      padding: 10px 12px;
      background: #ffe4e6;
      border-left: 4px solid var(--accent-red);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-red);
      border: 1px solid var(--border-color);
    }

    .marks-highlight { font-size: 16px; font-weight: bold; color: var(--accent-red); }
    .score-highlight { font-size: 16px; font-weight: bold; color: var(--accent-green); }

    .total-box {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      line-height: 1.6;
    }

    .preview-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 5px;
    }
    
    .img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    img.preview {
      width: 100%;
      height: 100%;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border-color);
    }

    .btn-del-photo {
      position: absolute;
      top: -5px; right: -5px;
      background: var(--accent-red);
      color: white;
      border-radius: 50%;
      width: 18px; height: 18px;
      font-size: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-weight: bold;
    }

    .editor-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 10px;
      box-sizing: border-box;
    }
    .editor-container {
      background: white;
      padding: 15px;
      border-radius: 12px;
      width: 95%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .canvas-wrapper {
      position: relative;
      max-width: 100%;
      border: 2px dashed #cbd5e1;
      background: #f8fafc;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      cursor: crosshair;
      touch-action: none;
    }
    .editor-controls {
      display: flex; gap: 10px; flex-wrap: wrap;
      justify-content: center; align-items: center;
      width: 100%;
    }
    .color-btn {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    .color-btn.active { transform: scale(1.2); border-color: #000; }
  </style>
</head>

</div>

<div id="editorModal" class="editor-modal">

  </div>
</div>

<script>
let data=[];
let filter="all";
let openSections={};
const TOTAL_MAX=6.20;

let currentPIndex = null;
let currentPtIndex = null;
let tempFileQueue = [];

let canvas = document.getElementById('editingCanvas');
let ctx = canvas.getContext('2d');

let isDrawing = false;
let penColor = '#ef4444'; 
let baseImage = new Image();

let scaleX = 1;
let scaleY = 1;
let drawingPaths = [];

const defaultGodownData = [
  {
    name: "RECEIVING PROCESS",
    points: [
      { 
        desc: "1) Receiving person must receive PO & Bill with Security Stamp. PO & Bill must be checked for correct store address before start of receiving. Samples along with PO & Invoice to be checked for all details like MRP, EAN, Grammage, Shelf Life, etc.", 
        hindiDesc: "Receiving person को Security Stamp के साथ PO & Bill प्राप्त करना चाहिए। Receiving शुरू करने से पहले PO & Bill में correct store address की जांच करनी चाहिए। Samples को PO & Invoice के साथ MRP, EAN, Grammage, Shelf Life आदि सभी details के लिए check किया जाना चाहिए।.", 
        marks: 0.1, checked: false, comment: "", photos: [], isHighlighted: true 
      },
      { 
        desc: "2) Debits to be handed over to vendor before the start of receiving.", 
        hindiDesc: "Receiving शुरू करने से पहले Debits को vendor को सौंप दिया जाना चाहिए।.",
        marks: 0.1, checked: false, comment: "", photos: [], isHighlighted: false 
      },
      { 
        desc: "3) Receiving person to make space available for new stocks and supervise the stacking of the entire new stock in the designated place in godown by the vendor. Enter details in Inward Register immediately after each receiving is complete & affix Inward stamp on Bill.", 
        hindiDesc: "Receiving person को new stocks के लिए space available करना चाहिए और vendor द्वारा godown में designated place पर पूरे new stock की stacking को supervise करना चाहिए। प्रत्येक receiving complete होने के तुरंत बाद Inward Register में details enter करें और Bill पर Inward stamp लगाएं।.",
        marks: 0.1, checked: false, comment: "", photos: [], isHighlighted: true 
      },
      { 
        desc: "4) Handover sample basket, PO & Invoice to GRN after each receiving is entered in the register. Short receiving quantities must be corrected in both copies of Invoice.", 
        hindiDesc: "Register में प्रत्येक receiving enter होने के बाद sample basket, PO & Invoice को GRN को handover करें। Invoice की दोनों copies में short receiving quantities को correct किया जाना चाहिए।.",
        marks: 0.05, checked: false, comment: "", photos: [], isHighlighted: true 
      }
    ]
  },
  {
    name: "INWARD REGISTER",

        hindiDesc: "प्रत्येक PO/Bill receive करने के तुरंत बाद Receiving Person द्वारा Inward Registers में entries की जाती हैं। यह उसी Inward No के लिए double entries या गलत registers में entry से बचने के लिए है। Inward Nos serial wise enter किए जाने चाहिए। Numbers उसी sequence में जारी रहेंगे जिसमें केवल month no change होगा - जैसे 01/234 (Jan की last entry); 02/235 (Feb की 1st entry) आदि। किसी भी wrong entry को cover करने के लिए overwriting, Whitener या blank stickers का use नहीं किया जाना चाहिए। Corrections के लिए एक single line cancellation किया जाना चाहिए और उस particular entry के ऊपर या नीचे new details write की जानी चाहिए। केवल Quantity corrections नहीं किए जाने चाहिए।.",

        hindiDesc: "Core FMCG; Core Grocery (Pack & Loose with partition); Non Core (with partitions) जैसे Garments; Hosiery; Footwear; Plastics; Stainless Steel; Bed & Bath; Seasonal; Stationery आदि के लिए अलग Registers maintain किए जाने चाहिए। प्रत्येक section के लिए proper abbreviations सही ढंग से enter किए जाने चाहिए। FMCG के लिए: 01/001; Pack Grocery के लिए: 01/PG/001; Loose Grocery के लिए: 01/LG/001; Garments के लिए: 01/G/001 आदि।.",
        marks: 0.1, checked: false, comment: "", photos: [], isHighlighted: false 
      },

function formatTitleCase(str) {
  if (!str) return "";
  return str.toLowerCase().split(' ').map(word => {
    if (!word) return "";
    return word.charAt(0).toUpperCase() + word.slice(1);
  }).join(' ');
}

function saveData(){ 
  try {
    localStorage.setItem("auditDataGodan2026_v16", JSON.stringify(data));
  } catch(e) {
    alert("Storage limit reached! Some photos might be too large.");
  }
}

function loadData(){
  try {
    let saved = localStorage.getItem("auditDataGodan2026_v16");
    if(saved){ 
      data = JSON.parse(saved); 
      data.forEach(proc => {
        proc.points.forEach(pt => {
          if(pt.marks !== undefined) {
            pt.marks = Number(Number(pt.marks).toFixed(2));
          }
          if(!pt.photos) pt.photos = [];
          if(pt.showHindi === undefined) pt.showHindi = false;
          if(pt.isHighlighted === undefined) pt.isHighlighted = false;
          if(pt.comment) pt.comment = pt.comment.trim();
        });
      });
    } else {
      data = JSON.parse(JSON.stringify(defaultGodownData));
      data.forEach(proc => proc.points.forEach(pt => { pt.showHindi = false; }));
    }
  } catch(e) {
    console.warn("Storage reset due to parse error:", e);
    localStorage.removeItem("auditDataGodan2026_v16");
    data = JSON.parse(JSON.stringify(defaultGodownData));
    data.forEach(proc => proc.points.forEach(pt => { pt.showHindi = false; }));
  }
  render(); calc(); renderReport(); 
}

function clearAll(){
  if(data.length === 0) return;
  if(confirm("Do you want to clear all checkmarks, remarks, and photos?")){
    data.forEach(proc => { proc.points.forEach(pt => { pt.checked = false; pt.comment = ""; pt.photos = []; pt.showHindi = false; }); });
    render(); calc(); renderReport(); saveData();
  }
}

document.getElementById("upload").addEventListener("change", function(e){
  let reader=new FileReader();
  reader.onload=function(e){
    let dataArr = new Uint8Array(e.target.result);
    let wb = XLSX.read(dataArr, {type: 'array', cellStyles: true, cellFormula: true, cellDates: true});
    let sheetName = wb.SheetNames[0];
    let sheet = wb.Sheets[sheetName];
    
    let range = XLSX.utils.decode_range(sheet['!ref'] || "A1:E100");
    let rows = [];
    for(let R = range.s.r; R <= range.e.r; ++R){
      let rowCells = [];
      for(let C = range.s.c; C <= range.e.c; ++C){
        let cellAddress = XLSX.utils.encode_cell({r: R, c: C});
        let cell = sheet[cellAddress];
        let val = cell ? cell.v : "";
        let isRed = false;
        if(cell && cell.s && cell.s.font && cell.s.font.color) {
          let fc = cell.s.font.color;
          let rgb = (fc.rgb || fc.theme || "").toString().toLowerCase();
          if(rgb.includes("ff0000") || rgb.includes("red") || rgb === "5" || rgb === "2" || (fc.rgb && fc.rgb.toUpperCase() === "FF0000")) {
            isRed = true;
          }
        }
        rowCells.push({val: val, isRed: isRed});
      }
      rows.push(rowCells);
    }
    parseAdvanced(rows);
  };
  reader.readAsArrayBuffer(e.target.files[0]);
});

function parseAdvanced(rows){
  data=[]; openSections={}; let current=null;
  rows.forEach(r=>{
    let textCells = r.map(c => c.val ? c.val.toString().trim() : "");
    let fullText = textCells.join(" ");
    if(!fullText) return;
    
    let isRowRed = r.some(c => c.isRed);
    
    if(fullText === fullText.toUpperCase() && fullText.length > 3 && !isRowRed){
      current = {name: fullText, points: []};
      data.push(current);
      return;
    }
    
    let marks = null, desc = "";
    for(let i = textCells.length - 1; i >= 0; i--){
      if(!isNaN(textCells[i]) && textCells[i] !== ""){
        marks = Number(parseFloat(textCells[i]).toFixed(2));
        desc = textCells.slice(0, i).filter(Boolean).join(" ");
        break;
      }
    }
    if(desc && marks !== null && current){
      current.points.push({desc, hindiDesc: desc, marks, checked: false, comment: "", photos: [], showHindi: false, isHighlighted: isRowRed});
    }
  });
  
  if(data.length === 0) {
    data = JSON.parse(JSON.stringify(defaultGodownData));
  }
  render(); calc(); renderReport(); saveData();
}

function processIncomingMedia(p, i, input) {
  if (!input.files || input.files.length === 0) return;
  tempFileQueue = Array.from(input.files);
  currentPIndex = p;
  currentPtIndex = i;
  input.value = "";
  launchNextImageFromQueue();
}

function launchNextImageFromQueue() {
  if (tempFileQueue.length === 0) return;
  let nextFile = tempFileQueue.shift();
  let reader = new FileReader();
  reader.onload = function(e) { openEditor(e.target.result); };
  reader.readAsDataURL(nextFile);
}

function openEditor(imgSrc) {
  document.getElementById("editorModal").style.display = "flex";
  drawingPaths = [];
  
  baseImage.onload = function() {
    let displayMaxW = Math.min(window.innerWidth * 0.90, 550);
    let displayMaxH = window.innerHeight * 0.50;
    
    let width = baseImage.width;
    let height = baseImage.height;
    
    if (width > displayMaxW) { height *= (displayMaxW / width); width = displayMaxW; }
    if (height > displayMaxH) { width *= (displayMaxH / height); height = displayMaxH; }
    
    canvas.width = width;
    canvas.height = height;
    
    scaleX = baseImage.naturalWidth / canvas.width;
    scaleY = baseImage.naturalHeight / canvas.height;
    
    redrawCanvas();
  };
  baseImage.src = imgSrc;
}

function redrawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(baseImage, 0, 0, canvas.width, canvas.height);
  
  drawingPaths.forEach(path => {
    ctx.beginPath();
    ctx.strokeStyle = path.color;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    path.points.forEach((pt, idx) => {
      let screenX = pt.x / scaleX;
      let screenY = pt.y / scaleY;
      if (idx === 0) ctx.moveTo(screenX, screenY);
      else ctx.lineTo(screenX, screenY);
    });
    ctx.stroke();
  });
}

function setPenColor(color, element) {
  penColor = color;
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
  element.classList.add('active');
}

function resetCanvasDrawing() {
  drawingPaths = [];
  redrawCanvas();
}

function getCanvasCoords(e) {
  let rect = canvas.getBoundingClientRect();
  let clientX = e.touches ? e.touches[0].clientX : e.clientX;
  let clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function startDrawing(e) {
  let coords = getCanvasCoords(e);
  isDrawing = true;
  let currentPath = { color: penColor, points: [{ x: coords.x * scaleX, y: coords.y * scaleY }] };
  drawingPaths.push(currentPath);
  e.preventDefault();
}

function draw(e) {
  if (!isDrawing) return;
  let coords = getCanvasCoords(e);
  let path = drawingPaths[drawingPaths.length - 1];
  path.points.push({ x: coords.x * scaleX, y: coords.y * scaleY });
  redrawCanvas();
  e.preventDefault();
}

function stopDrawing() { isDrawing = false; }

canvas.addEventListener('mousedown', startDrawing);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDrawing);
canvas.addEventListener('touchstart', startDrawing);
canvas.addEventListener('touchmove', draw);
canvas.addEventListener('touchend', stopDrawing);

function closeEditor() { document.getElementById("editorModal").style.display = "none"; launchNextImageFromQueue(); }

function saveEditedPhoto() {
  let hdFinalCanvas = document.createElement('canvas');
  let hdFinalCtx = hdFinalCanvas.getContext('2d');
  
  hdFinalCanvas.width = baseImage.naturalWidth;
  hdFinalCanvas.height = baseImage.naturalHeight;
  
  hdFinalCtx.drawImage(baseImage, 0, 0);
  
  drawingPaths.forEach(path => {
    hdFinalCtx.beginPath();
    hdFinalCtx.strokeStyle = path.color;
    hdFinalCtx.lineWidth = (baseImage.naturalWidth / 500) * 5; 
    hdFinalCtx.lineCap = 'round';
    hdFinalCtx.lineJoin = 'round';
    
    path.points.forEach((pt, idx) => {
      if (idx === 0) hdFinalCtx.moveTo(pt.x, pt.y);
      else hdFinalCtx.lineTo(pt.x, pt.y);
    });
    hdFinalCtx.stroke();
  });
  
  if (!data[currentPIndex].points[currentPtIndex].photos) {
    data[currentPIndex].points[currentPtIndex].photos = [];
  }
  
  let fullResolutionDataUrl = hdFinalCanvas.toDataURL('image/jpeg', 0.85);
  data[currentPIndex].points[currentPtIndex].photos.push(fullResolutionDataUrl);
  
  document.getElementById("editorModal").style.display = "none";
  render(); renderReport(); saveData();
  launchNextImageFromQueue();
}

function deletePhoto(e, p, i, imgIndex){
  if(e) e.stopPropagation();
  data[p].points[i].photos.splice(imgIndex, 1);
  render(); calc(); renderReport(); saveData();
}

function calc(){
  let d = 0;
  data.forEach(proc => {
    proc.points.forEach(pt => {
      if(pt.checked) d += Number(pt.marks);
    });
  });
  let totalDeduction = Number(d.toFixed(2));
  let finalScore = Number((TOTAL_MAX - totalDeduction).toFixed(2));
  
  document.getElementById("result").innerHTML =
  `<span class="marks-highlight">Total Deduction: ${totalDeduction.toFixed(2)}</span> &nbsp;|&nbsp; 
   <span class="score-highlight">Final Score: ${finalScore.toFixed(2)} / ${TOTAL_MAX.toFixed(2)}</span>`;
}

function renderReport(){
  let html=""; let sectionTotals={}, total=0;
  data.forEach(proc=>{
    proc.points.forEach(pt=>{
      if(pt.checked){
        total += Number(pt.marks);
        if(!sectionTotals[proc.name]) sectionTotals[proc.name]=0;
        sectionTotals[proc.name] += Number(pt.marks);
      }
    });
  });
  for(let sec in sectionTotals){
    html+=`<div class="comment-box">${formatTitleCase(sec)} : -${Number(sectionTotals[sec]).toFixed(2)} Marks</div>`;
  }
  let totalDeductFormatted = Number(total).toFixed(2);
  let finalScoreFormatted = Number(TOTAL_MAX - total).toFixed(2);
  html+=`<div class="total-box">Total Deduction: ${totalDeductFormatted} / ${TOTAL_MAX.toFixed(2)}<br>
    <span style="color:var(--accent-green)">Final Score: ${finalScoreFormatted}</span></div>`;
  document.getElementById("deductionReport").innerHTML=html;
}

function dataURLtoFile(dataurl, filename) {
  let arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
      bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
  while(n--){
      u8arr[n] = bstr.charCodeAt(n);
  }
  return new File([u8arr], filename, {type:mime});
}

function generateSummaryText(includePhotoTag = true) {
  const now = new Date();
  const dateFormatted = now.toLocaleDateString('en-GB');
  
  let txt = `*Godown Process*\n   *Date:- ${dateFormatted}*\n\n`;
  
  data.forEach((proc, index) => {
    let procTotalMarks = 0;
    let procDeductedMarks = 0;
    let hasDeductions = false;
    let deductionDetails = [];

    let formattedName = formatTitleCase(proc.name).trim();

    proc.points.forEach((pt, ptIndex) => {
      let m = Number(pt.marks);
      procTotalMarks += m;

      if(pt.checked) {
        hasDeductions = true;
        procDeductedMarks += m;

        let cleanComment = pt.comment ? pt.comment.trim() : "";
        let detailStr = "";
        
        if (cleanComment !== "") {
          detailStr = cleanComment;
        } else {
          let cleanDesc = pt.desc.replace(/<[^>]*>/g, '').trim();
          detailStr = cleanDesc.length > 50 ? cleanDesc.substring(0, 47) + "..." : cleanDesc;
        }

        if (includePhotoTag && pt.photos && pt.photos.length > 0) {
          detailStr += ` 📷 (${pt.photos.length} Photo)`;
        }

        deductionDetails.push(`*⚠️ ${detailStr}*`);
      }
    });

    let procMax = procTotalMarks.toFixed(2);
    let procAchieved = (procTotalMarks - procDeductedMarks).toFixed(2);

    if (!hasDeductions) {
      txt += `${index + 1}) ${formattedName} ${procMax}/${procAchieved} ✅\n`;
    } else {
      txt += `${index + 1}) ${formattedName} ${procMax}/${procAchieved} ❌\n`;
      deductionDetails.forEach(detail => {
        txt += `   ${detail}\n`;
      });
    }
  });

  let totalDeductions = 0;
  data.forEach(proc => {
    proc.points.forEach(pt => {
      if(pt.checked) totalDeductions += Number(pt.marks);
    });
  });

  let totalMaxFormatted = TOTAL_MAX.toFixed(2);
  let totalAchievedFormatted = (TOTAL_MAX - totalDeductions).toFixed(2);

  txt += `\n*Total :- ${totalMaxFormatted}/${totalAchievedFormatted}*`;
  return txt;
}

async function shareSummaryWhatsAppWithImages() {
  let txt = generateSummaryText(true); // Include Photo count tag
  let allAttachedFiles = [];
  let fileCount = 1;

  data.forEach(proc => {
    proc.points.forEach(pt => {
      if (pt.checked && pt.photos && pt.photos.length > 0) {
        pt.photos.forEach(imgData => {
          try {
            let f = dataURLtoFile(imgData, `Godown_Audit_Proof_${fileCount}.jpg`);
            allAttachedFiles.push(f);
            fileCount++;
          } catch(e) { console.log(e); }
        });
      }
    });
  });

  if (navigator.share && allAttachedFiles.length > 0 && navigator.canShare && navigator.canShare({ files: allAttachedFiles })) {
    try {
      await navigator.share({
        title: 'Godown Process Summary',
        text: txt,
        files: allAttachedFiles
      });
      return;
    } catch (err) {
      console.log("Native Share Dismissed", err);
    }
  } else if (allAttachedFiles.length === 0) {
    alert("No photos attached! Sharing text summary instead.");
  }

  window.location.href = "https://wa.me/?text=" + encodeURIComponent(txt);
}

function shareSummaryWhatsAppTextOnly() {
  let txt = generateSummaryText(false); // NO Photo tag included
  window.location.href = "https://wa.me/?text=" + encodeURIComponent(txt);
}

async function exportToExcel(){
  if(data.length === 0) return;
  let reportRows = [
    ["Godown Process Audit Report 2026"],
    ["Developed by:", "Sk"],
    [],
    ["Process Section", "Point Description", "Deduction Marks", "Status", "Auditor Comment", "Is Highlighted"]
  ];
  data.forEach(proc => {
    proc.points.forEach((pt, idx) => {
      reportRows.push([formatTitleCase(proc.name), pt.desc.replace(/<[^>]*>/g, '').trim(), Number(pt.marks).toFixed(2), pt.checked ? "DEDUCT" : "OK", pt.comment ? pt.comment.trim() : "", pt.isHighlighted ? "YES" : "NO"]);
    });
  });
  let totalDeduct = 0;
  data.forEach(p => p.points.forEach(pt => { if(pt.checked) totalDeduct += Number(pt.marks); }));
  reportRows.push([]);
  reportRows.push(["", "", "Total Deduction:", Number(totalDeduct).toFixed(2)]);
  reportRows.push(["", "", "Final Score:", Number(TOTAL_MAX - totalDeduct).toFixed(2)]);

  let ws = XLSX.utils.aoa_to_sheet(reportRows);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Audit Live Report");

  const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  let now = new Date();
  let dateStr = now.toLocaleDateString('en-GB').replace(/\//g, '-');
  let timeStr = now.toLocaleTimeString().replace(/:/g, '-');
  let fileName = `GODOWN_PROCESS_DAILY_CHECK_${dateStr}_${timeStr}.xlsx`;
  const file = new File([blob], fileName, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { 
      await navigator.share({ files: [file], title: 'Audit Report', text: 'Godown Audit Excel Report' }); 
      return;
    } catch (err) { console.log("Share dismissed"); }
  } 
  
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

async function sharePDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 15;
  const now = new Date();
  const pageHeight = doc.internal.pageSize.height;
  const pageWidth = doc.internal.pageSize.width;

  doc.setFillColor(49, 130, 206);
  doc.rect(14, y, pageWidth - 28, 16, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont("Helvetica", "bold");
  doc.setFontSize(12);
  doc.text("GODOWN PROCESS 2026 DAILY CHECK", pageWidth / 2, y + 10, { align: "center" });
  y += 20;

  doc.setFont("Helvetica", "normal");
  doc.setFontSize(9);
  doc.setTextColor(45, 55, 72);
  doc.text("sk", 14, y);
  y += 6;

  const dateStr = now.toLocaleDateString('en-GB');
  const timeStr = now.toLocaleTimeString();
  doc.text(`Audit Date & Time: ${dateStr} | ${timeStr}`, 14, y);
  y += 8;

  let total = 0;
  let sectionTotals = {};
  data.forEach(proc => {
    proc.points.forEach(pt => {
      if (pt.checked) {
        total += Number(pt.marks);
        if (!sectionTotals[proc.name]) sectionTotals[proc.name] = 0;
        sectionTotals[proc.name] += Number(pt.marks);
      }
    });
  });

  let numSections = Object.keys(sectionTotals).length;
  let summaryBoxHeight = 36 + (numSections * 7);
  
  doc.setDrawColor(209, 213, 219);
  doc.setFillColor(248, 250, 252);
  doc.roundedRect(14, y, pageWidth - 28, summaryBoxHeight, 3, 3, 'FD');

  let boxY = y + 7;
  doc.setFont("Helvetica", "bold");
  doc.setFontSize(10);
  doc.text("Summary of Deductions:", 18, boxY);
  boxY += 6;

  doc.setFont("Helvetica", "normal");
  let count = 1;
  for (let sec in sectionTotals) {
    doc.text(`${count}. ${formatTitleCase(sec)}`, 18, boxY);
    doc.text(`-${Number(sectionTotals[sec]).toFixed(2)} M`, pageWidth - 25, boxY, { align: "right" });
    boxY += 6;
    count++;
  }

  boxY += 2;
  doc.setDrawColor(209, 213, 219);
  doc.line(18, boxY, pageWidth - 18, boxY);
  boxY += 6;

  doc.setFont("Helvetica", "bold");
  doc.setTextColor(229, 62, 62);
  doc.text(`Total Deduction: ${Number(total).toFixed(2)} / ${TOTAL_MAX.toFixed(2)}`, 18, boxY);
  doc.setTextColor(56, 161, 105);
  doc.text(`Final Score: ${Number(TOTAL_MAX - total).toFixed(2)}`, pageWidth - 25, boxY, { align: "right" });
  
  y += summaryBoxHeight + 10;

  if (y > pageHeight - 25) { doc.addPage(); y = 20; }
  doc.setTextColor(45, 55, 72);
  doc.setFont("Helvetica", "bold");
  doc.setFontSize(11);
  doc.text("DETAILED NON-COMPLIANCE REPORT", 14, y);
  y += 6;

  data.forEach(proc => {
    proc.points.forEach((pt, i) => {
      if (pt.checked) {
        if (y > pageHeight - 35) { doc.addPage(); y = 20; }
        doc.setFont("Helvetica", "bold");
        doc.setFontSize(9);
        doc.setTextColor(49, 130, 206);
        doc.text(`${formatTitleCase(proc.name)} (-${Number(pt.marks).toFixed(2)} M)`, 14, y);
        y += 5;

        doc.setFont("Helvetica", "normal");
        doc.setTextColor(45, 55, 72);
        let cleanDesc = pt.desc.replace(/<[^>]*>/g, '').trim();
        let splitDesc = doc.splitTextToSize(`${i + 1}) ${cleanDesc}`, pageWidth - 28);
        doc.text(splitDesc, 14, y);
        y += (splitDesc.length * 4.5) + 2;

        let commentText = pt.comment ? `Deduct Point / Comment: ${pt.comment.trim()}` : `Deduct Point: `;
        let splitComment = doc.splitTextToSize(commentText, pageWidth - 28);
        doc.setTextColor(229, 62, 62);
        doc.text(splitComment, 14, y);
        y += (splitComment.length * 4.5) + 4;

        if (pt.photos && pt.photos.length > 0) {
          pt.photos.forEach((imgSrc) => {
            if (y > pageHeight - 50) { doc.addPage(); y = 20; }
            try {
              doc.addImage(imgSrc, 'JPEG', 14, y, 35, 35);
              y += 40;
            } catch(err) { console.log(err); }
          });
        }
        y += 3;
      }
    });
  });

  const pdfOutput = doc.output('blob');
  let dateStrName = now.toLocaleDateString('en-GB').replace(/\//g, '-');
  let timeStrName = now.toLocaleTimeString().replace(/:/g, '-');
  let pdfFileName = `GODOWN_PROCESS_REPORT_${dateStrName}_${timeStrName}.pdf`;
  const pdfFile = new File([pdfOutput], pdfFileName, { type: 'application/pdf' });

  if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
    try {
      await navigator.share({ files: [pdfFile], title: 'Godown Audit PDF Report', text: 'Godown Process Audit Report PDF' });
      return;
    } catch(err) { console.log("PDF share dismissed"); }
  }

  let url = URL.openObjectURL ? URL.openObjectURL(pdfOutput) : URL.createObjectURL(pdfOutput);
  let a = document.createElement('a');
  a.href = url;
  a.download = pdfFileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
