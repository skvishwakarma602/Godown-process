function formatTitleCase(str) {
  if (!str) return "";
  return str.toLowerCase().split(' ').map(word => {
    if (!word) return "";
    return word.charAt(0).toUpperCase() + word.slice(1);
  }).join(' ');
}

function saveData(){ 
  try {
    localStorage.setItem("auditDataGodan2026_v16", JSON.stringify(data));
  } catch(e) {
    alert("Storage limit reached! Some photos might be too large.");
  }
}

function loadData(){
  try {
    let saved = localStorage.getItem("auditDataGodan2026_v16");
    if(saved){ 
      data = JSON.parse(saved); 
      data.forEach(proc => {
        proc.points.forEach(pt => {
          if(pt.marks !== undefined) {
            pt.marks = Number(Number(pt.marks).toFixed(2));
          }
          if(!pt.photos) pt.photos = [];
          if(pt.showHindi === undefined) pt.showHindi = false;
          if(pt.isHighlighted === undefined) pt.isHighlighted = false;
          if(pt.comment) pt.comment = pt.comment.trim();
        });
      });
    } else {
      data = JSON.parse(JSON.stringify(defaultGodownData));
      data.forEach(proc => proc.points.forEach(pt => { pt.showHindi = false; }));
    }
  } catch(e) {
    console.warn("Storage reset due to parse error:", e);
    localStorage.removeItem("auditDataGodan2026_v16");
    data = JSON.parse(JSON.stringify(defaultGodownData));
    data.forEach(proc => proc.points.forEach(pt => { pt.showHindi = false; }));
  }
  render(); calc(); renderReport(); 
}

function clearAll(){
  if(data.length === 0) return;

    data.forEach(proc => { proc.points.forEach(pt => { pt.checked = false; pt.comment = ""; pt.photos = []; pt.showHindi = false; }); });
    render(); calc(); renderReport(); saveData();
  }
}

document.getElementById("upload").addEventListener("change", function(e){
  let reader=new FileReader();
  reader.onload=function(e){
    let dataArr = new Uint8Array(e.target.result);
    let wb = XLSX.read(dataArr, {type: 'array', cellStyles: true, cellFormula: true, cellDates: true});
    let sheetName = wb.SheetNames[0];
    let sheet = wb.Sheets[sheetName];
    
    let range = XLSX.utils.decode_range(sheet['!ref'] || "A1:E100");
    let rows = [];
    for(let R = range.s.r; R <= range.e.r; ++R){
      let rowCells = [];
      for(let C = range.s.c; C <= range.e.c; ++C){
        let cellAddress = XLSX.utils.encode_cell({r: R, c: C});
        let cell = sheet[cellAddress];
        let val = cell ? cell.v : "";
        let isRed = false;
        if(cell && cell.s && cell.s.font && cell.s.font.color) {
          let fc = cell.s.font.color;
          let rgb = (fc.rgb || fc.theme || "").toString().toLowerCase();
          if(rgb.includes("ff0000") || rgb.includes("red") || rgb === "5" || rgb === "2" || (fc.rgb && fc.rgb.toUpperCase() === "FF0000")) {
            isRed = true;
          }
        }
        rowCells.push({val: val, isRed: isRed});
      }
      rows.push(rowCells);
    }
    parseAdvanced(rows);
  };
  reader.readAsArrayBuffer(e.target.files[0]);
});

function parseAdvanced(rows){
  data=[]; openSections={}; let current=null;
  rows.forEach(r=>{
    let textCells = r.map(c => c.val ? c.val.toString().trim() : "");
    let fullText = textCells.join(" ");
    if(!fullText) return;
    
    let isRowRed = r.some(c => c.isRed);
    
    if(fullText === fullText.toUpperCase() && fullText.length > 3 && !isRowRed){
      current = {name: fullText, points: []};
      data.push(current);
      return;
    }
    
    let marks = null, desc = "";
    for(let i = textCells.length - 1; i >= 0; i--){
      if(!isNaN(textCells[i]) && textCells[i] !== ""){
        marks = Number(parseFloat(textCells[i]).toFixed(2));
        desc = textCells.slice(0, i).filter(Boolean).join(" ");
        break;
      }
    }
    if(desc && marks !== null && current){
      current.points.push({desc, hindiDesc: desc, marks, checked: false, comment: "", photos: [], showHindi: false, isHighlighted: isRowRed});
    }
  });
  
  if(data.length === 0) {
    data = JSON.parse(JSON.stringify(defaultGodownData));
  }
  render(); calc(); renderReport(); saveData();
}

function processIncomingMedia(p, i, input) {
  if (!input.files || input.files.length === 0) return;
  tempFileQueue = Array.from(input.files);
  currentPIndex = p;
  currentPtIndex = i;
  input.value = "";
  launchNextImageFromQueue();
}

function launchNextImageFromQueue() {
  if (tempFileQueue.length === 0) return;
  let nextFile = tempFileQueue.shift();
  let reader = new FileReader();
  reader.onload = function(e) { openEditor(e.target.result); };
  reader.readAsDataURL(nextFile);
}

function openEditor(imgSrc) {
  document.getElementById("editorModal").style.display = "flex";
  drawingPaths = [];
  
  baseImage.onload = function() {
    let displayMaxW = Math.min(window.innerWidth * 0.90, 550);
    let displayMaxH = window.innerHeight * 0.50;
    
    let width = baseImage.width;
    let height = baseImage.height;
    
    if (width > displayMaxW) { height *= (displayMaxW / width); width = displayMaxW; }
    if (height > displayMaxH) { width *= (displayMaxH / height); height = displayMaxH; }
    
    canvas.width = width;
    canvas.height = height;
    
    scaleX = baseImage.naturalWidth / canvas.width;
    scaleY = baseImage.naturalHeight / canvas.height;
    
    redrawCanvas();
  };
  baseImage.src = imgSrc;
}

function redrawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(baseImage, 0, 0, canvas.width, canvas.height);
  
  drawingPaths.forEach(path => {
    ctx.beginPath();
    ctx.strokeStyle = path.color;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    path.points.forEach((pt, idx) => {
      let screenX = pt.x / scaleX;
      let screenY = pt.y / scaleY;
      if (idx === 0) ctx.moveTo(screenX, screenY);
      else ctx.lineTo(screenX, screenY);
    });
    ctx.stroke();
  });
}

function setPenColor(color, element) {
  penColor = color;
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
  element.classList.add('active');
}

function resetCanvasDrawing() {
  drawingPaths = [];
  redrawCanvas();
}

function getCanvasCoords(e) {
  let rect = canvas.getBoundingClientRect();
  let clientX = e.touches ? e.touches[0].clientX : e.clientX;
  let clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function startDrawing(e) {
  let coords = getCanvasCoords(e);
  isDrawing = true;
  let currentPath = { color: penColor, points: [{ x: coords.x * scaleX, y: coords.y * scaleY }] };
  drawingPaths.push(currentPath);
  e.preventDefault();
}

function draw(e) {
  if (!isDrawing) return;
  let coords = getCanvasCoords(e);
  let path = drawingPaths[drawingPaths.length - 1];
  path.points.push({ x: coords.x * scaleX, y: coords.y * scaleY });
  redrawCanvas();
  e.preventDefault();
}

function stopDrawing() { isDrawing = false; }

canvas.addEventListener('mousedown', startDrawing);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDrawing);
canvas.addEventListener('touchstart', startDrawing);
canvas.addEventListener('touchmove', draw);
canvas.addEventListener('touchend', stopDrawing);

function closeEditor() { document.getElementById("editorModal").style.display = "none"; launchNextImageFromQueue(); }

function saveEditedPhoto() {
  let hdFinalCanvas = document.createElement('canvas');
  let hdFinalCtx = hdFinalCanvas.getContext('2d');
  
  hdFinalCanvas.width = baseImage.naturalWidth;
  hdFinalCanvas.height = baseImage.naturalHeight;
  
  hdFinalCtx.drawImage(baseImage, 0, 0);
  
  drawingPaths.forEach(path => {
    hdFinalCtx.beginPath();
    hdFinalCtx.strokeStyle = path.color;
    hdFinalCtx.lineWidth = (baseImage.naturalWidth / 500) * 5; 
    hdFinalCtx.lineCap = 'round';
    hdFinalCtx.lineJoin = 'round';
    
    path.points.forEach((pt, idx) => {
      if (idx === 0) hdFinalCtx.moveTo(pt.x, pt.y);
      else hdFinalCtx.lineTo(pt.x, pt.y);
    });
    hdFinalCtx.stroke();
  });
  
  if (!data[currentPIndex].points[currentPtIndex].photos) {
    data[currentPIndex].points[currentPtIndex].photos = [];
  }
  
  let fullResolutionDataUrl = hdFinalCanvas.toDataURL('image/jpeg', 0.85);
  data[currentPIndex].points[currentPtIndex].photos.push(fullResolutionDataUrl);
  
  document.getElementById("editorModal").style.display = "none";
  render(); renderReport(); saveData();
  launchNextImageFromQueue();
}

function deletePhoto(e, p, i, imgIndex){
  if(e) e.stopPropagation();
  data[p].points[i].photos.splice(imgIndex, 1);
  render(); calc(); renderReport(); saveData();
}

function calc(){
  let d = 0;
  data.forEach(proc => {
    proc.points.forEach(pt => {
      if(pt.checked) d += Number(pt.marks);

  let totalDeduction = Number(d.toFixed(2));
  let finalScore = Number((TOTAL_MAX - totalDeduction).toFixed(2));
  
  document.getElementById("result").innerHTML =
  `<span class="marks-highlight">Total Deduction: ${totalDeduction.toFixed(2)}</span> &nbsp;|&nbsp; 
   <span class="score-highlight">Final Score: ${finalScore.toFixed(2)} / ${TOTAL_MAX.toFixed(2)}</span>`;
}

function renderReport(){

function dataURLtoFile(dataurl, filename) {
  let arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
      bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
  while(n--){
      u8arr[n] = bstr.charCodeAt(n);
  }
  return new File([u8arr], filename, {type:mime});
}

function generateSummaryText(includePhotoTag = true) {
  const now = new Date();
  const dateFormatted = now.toLocaleDateString('en-GB');
  
  let txt = `*Godown Process*\n   *Date:- ${dateFormatted}*\n\n`;
  
  data.forEach((proc, index) => {
    let procTotalMarks = 0;
    let procDeductedMarks = 0;
    let hasDeductions = false;
    let deductionDetails = [];

    let formattedName = formatTitleCase(proc.name).trim();

    proc.points.forEach((pt, ptIndex) => {
      let m = Number(pt.marks);
      procTotalMarks += m;

      if(pt.checked) {
        hasDeductions = true;
        procDeductedMarks += m;

        let cleanComment = pt.comment ? pt.comment.trim() : "";
        let detailStr = "";
        
        if (cleanComment !== "") {
          detailStr = cleanComment;
        } else {
          let cleanDesc = pt.desc.replace(/<[^>]*>/g, '').trim();
          detailStr = cleanDesc.length > 50 ? cleanDesc.substring(0, 47) + "..." : cleanDesc;
        }

        if (includePhotoTag && pt.photos && pt.photos.length > 0) {
          detailStr += `  (${pt.photos.length} Photo)`;
        }

        deductionDetails.push(`* ${detailStr}*`);
      }
    });

    let procMax = procTotalMarks.toFixed(2);
    let procAchieved = (procTotalMarks - procDeductedMarks).toFixed(2);

    if (!hasDeductions) {
      txt += `${index + 1}) ${formattedName} ${procMax}/${procAchieved} \n`;
    } else {
      txt += `${index + 1}) ${formattedName} ${procMax}/${procAchieved} \n`;
      deductionDetails.forEach(detail => {
        txt += `   ${detail}\n`;
      });
    }
  });

  let totalDeductions = 0;
  data.forEach(proc => {
    proc.points.forEach(pt => {
      if(pt.checked) totalDeductions += Number(pt.marks);
    });
  });

  let totalMaxFormatted = TOTAL_MAX.toFixed(2);
  let totalAchievedFormatted = (TOTAL_MAX - totalDeductions).toFixed(2);

  txt += `\n*Total :- ${totalMaxFormatted}/${totalAchievedFormatted}*`;
  return txt;
}

async function shareSummaryWhatsAppWithImages() {
  let txt = generateSummaryText(true);
  let allAttachedFiles = [];
  let fileCount = 1;

  data.forEach(proc => {
    proc.points.forEach(pt => {
      if (pt.checked && pt.photos && pt.photos.length > 0) {
        pt.photos.forEach(imgData => {
          try {
            let f = dataURLtoFile(imgData, `Godown_Audit_Proof_${fileCount}.jpg`);
            allAttachedFiles.push(f);
            fileCount++;
          } catch(e) { console.log(e); }
        });
      }
    });
  });

  if (navigator.share && allAttachedFiles.length > 0 && navigator.canShare && navigator.canShare({ files: allAttachedFiles })) {
    try {
      await navigator.share({
        title: 'Godown Process Summary',
        text: txt,
        files: allAttachedFiles
      });
      return;
    } catch (err) {
      console.log("Native Share Dismissed", err);
    }
  } else if (allAttachedFiles.length === 0) {
    alert("No photos attached! Sharing text summary instead.");
  }

  window.location.href = "https://wa.me/?text=" + encodeURIComponent(txt);
}

}

async function exportToExcel(){
  if(data.length === 0) return;
  let reportRows = [
    ["Godown Process Audit Report 2026"],
    ["Developed by:", "Sk"],
    [],
    ["Process Section", "Point Description", "Deduction Marks", "Status", "Auditor Comment", "Is Highlighted"]
  ];
  data.forEach(proc => {
    proc.points.forEach((pt, idx) => {
      reportRows.push([formatTitleCase(proc.name), pt.desc.replace(/<[^>]*>/g, '').trim(), Number(pt.marks).toFixed(2), pt.checked ? "DEDUCT" : "OK", pt.comment ? pt.comment.trim() : "", pt.isHighlighted ? "YES" : "NO"]);
    });
  });
  let totalDeduct = 0;
  data.forEach(p => p.points.forEach(pt => { if(pt.checked) totalDeduct += Number(pt.marks); }));
  reportRows.push([]);
  reportRows.push(["", "", "Total Deduction:", Number(totalDeduct).toFixed(2)]);
  reportRows.push(["", "", "Final Score:", Number(TOTAL_MAX - totalDeduct).toFixed(2)]);

  let ws = XLSX.utils.aoa_to_sheet(reportRows);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Audit Live Report");

  const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  let now = new Date();
  let dateStr = now.toLocaleDateString('en-GB').replace(/\//g, '-');
  let timeStr = now.toLocaleTimeString().replace(/:/g, '-');
  let fileName = `GODOWN_PROCESS_DAILY_CHECK_${dateStr}_${timeStr}.xlsx`;
  const file = new File([blob], fileName, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { 
      await navigator.share({ files: [file], title: 'Audit Report', text: 'Godown Audit Excel Report' }); 
      return;
    } catch (err) { console.log("Share dismissed"); }
  } 
  
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
